<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bảo hành - VacuumStore</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body class="bg-gray-50">

<!-- Navbar giống hệt 3 file trên (copy-paste nguyên khối navbar từ return-policy.html) -->

<div class="max-w-4xl mx-auto px-6 py-12">
    <h1 class="text-4xl font-bold text-center mb-2">Chính sách bảo hành</h1>
    <p class="text-center text-cyan-600 font-semibold">Bảo hành chính hãng 24 tháng</p>

    <div class="bg-white rounded-3xl shadow p-8 mt-10">
        <div class="flex items-center gap-4 mb-8">
            <i class="fa-solid fa-shield-halved text-5xl text-blue-500"></i>
            <div class="text-2xl font-semibold">Bảo hành 24 tháng toàn quốc</div>
        </div>
        <ul class="space-y-6 text-gray-700">
            <li class="flex gap-3"><i class="fa-solid fa-check text-green-500 mt-1"></i> Sửa chữa miễn phí lỗi kỹ thuật trong 24 tháng</li>
            <li class="flex gap-3"><i class="fa-solid fa-check text-green-500 mt-1"></i> Thay thế linh kiện chính hãng miễn phí</li>
            <li class="flex gap-3"><i class="fa-solid fa-check text-green-500 mt-1"></i> Hỗ trợ kỹ thuật 24/7 qua hotline</li>
            <li class="flex gap-3"><i class="fa-solid fa-check text-green-500 mt-1"></i> Bảo hành pin 12 tháng (đối với máy hút bụi cầm tay)</li>
        </ul>
        <div class="mt-10 text-center">
            <a href="contact.html" class="inline-block bg-cyan-600 text-white px-10 py-4 rounded-3xl font-semibold hover:bg-cyan-700">Đăng ký bảo hành ngay</a>
        </div>
    </div>
</div>
