<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi tiết sản phẩm - VacuumStore</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', system-ui, sans-serif; }
        .product-image { transition: all 0.3s; }
    </style>
</head>
<body class="bg-gray-50">

<!-- Navbar -->
<nav class="bg-white shadow-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-6">
        <div class="flex items-center justify-between h-16">
            <div class="flex items-center gap-3">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-10 h-10 text-cyan-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.25">
                    <rect x="4" y="7" width="13" height="9" rx="2" ry="2" />
                    <path d="M17 12h4v4" />
                    <circle cx="8" cy="18" r="2" />
                    <line x1="16" y1="16" x2="20" y2="16" />
                    <path d="M9 4v3" />
                </svg>
                <h1 class="text-3xl font-bold tracking-[-1px]"><span class="text-cyan-600">Vacuum</span>Store</h1>
            </div>
            <a href="product.html" class="flex items-center gap-2 text-cyan-600 font-medium">
                <i class="fa-solid fa-arrow-left"></i> Quay lại sản phẩm
            </a>
        </div>
    </div>
</nav>

<div class="max-w-7xl mx-auto px-6 py-10">
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-12" id="productDetail">
        <!-- Nội dung sẽ được render bằng JS -->
    </div>
</div>

<script>
// Load sản phẩm từ localStorage (đồng bộ với Admin)
let products = JSON.parse(localStorage.getItem('products')) || [];

function getProductById(id) {
    return products.find(p => p.id === parseInt(id));
}

function renderDetail() {
    const urlParams = new URLSearchParams(window.location.search);
    const id = urlParams.get('id');
    const product = getProductById(id);

    if (!product) {
        document.getElementById('productDetail').innerHTML = `
            <div class="col-span-2 text-center py-20">
                <h2 class="text-2xl font-bold text-red-500">Không tìm thấy sản phẩm!</h2>
                <a href="product.html" class="mt-6 inline-block bg-cyan-600 text-white px-8 py-4 rounded-3xl">Quay lại danh sách</a>
            </div>`;
        return;
    }

    // Lấy ảnh chính (hỗ trợ images hoặc img cũ)
    const mainImage = product.images && product.images.length > 0 
        ? product.images[0] 
        : (product.img || "https://picsum.photos/id/1015/800/800");

    let galleryHTML = '';
    if (product.images && product.images.length > 1) {
        galleryHTML = `<div class="flex gap-3 mt-4">`;
        product.images.forEach((img, index) => {
            galleryHTML += `
                <img onclick="changeMainImage(this)" 
                     src="${img}" 
                     class="w-20 h-20 object-cover rounded-2xl cursor-pointer border-2 border-transparent hover:border-cyan-500">`;
        });
        galleryHTML += `</div>`;
    }

    const html = `
        <div>
            <img id="mainImage" src="${mainImage}" class="w-full rounded-3xl shadow-lg product-image" alt="${product.name}">
            ${galleryHTML}
        </div>

        <div>
            <p class="text-cyan-600 font-medium">${product.brand}</p>
            <h1 class="text-4xl font-bold mt-2 mb-4">${product.name}</h1>
            <p class="text-5xl font-bold text-cyan-600">${product.price.toLocaleString('vi-VN')}đ</p>

            <!-- Mô tả -->
            <div class="mt-8">
                <h3 class="font-semibold text-lg mb-3">Mô tả sản phẩm</h3>
                <p class="text-gray-600 leading-relaxed">${product.desc || 'Sản phẩm chất lượng cao từ VacuumStore.'}</p>
            </div>

            <div class="mt-10 flex gap-4">
                <button onclick="addToCart(${product.id});" 
                        class="flex-1 bg-black text-white py-5 rounded-3xl text-lg font-semibold hover:bg-cyan-600 transition">
                    Thêm vào giỏ hàng
                </button>
                <button onclick="toggleWishlist(${product.id});" 
                        class="flex-1 border border-gray-300 py-5 rounded-3xl text-lg font-semibold hover:bg-gray-50 transition flex items-center justify-center gap-3">
                    <i class="fa-solid fa-heart text-xl ${isInWishlist(product.id) ? 'text-red-500' : 'text-gray-400'}"></i>
                    Yêu thích
                </button>
            </div>

            <div class="mt-8 text-sm text-gray-500 flex items-center gap-8">
                <div><i class="fa-solid fa-truck"></i> Giao hàng miễn phí từ 500.000đ</div>
                <div><i class="fa-solid fa-shield-halved"></i> Bảo hành 24 tháng</div>
            </div>
        </div>
    `;

    document.getElementById('productDetail').innerHTML = html;
}

// Thay đổi ảnh chính khi click thumbnail
function changeMainImage(el) {
    document.getElementById('mainImage').src = el.src;
}

function isInWishlist(id) {
    let wishlist = JSON.parse(localStorage.getItem('wishlist')) || [];
    return wishlist.some(item => item.id === id);
}

function toggleWishlist(id) {
    let wishlist = JSON.parse(localStorage.getItem('wishlist')) || [];
    const product = products.find(p => p.id === id);
    const index = wishlist.findIndex(item => item.id === id);
    if (index > -1) wishlist.splice(index, 1);
    else wishlist.push(product);
    localStorage.setItem('wishlist', JSON.stringify(wishlist));
    renderDetail();
    alert(index > -1 ? '💔 Đã xóa khỏi yêu thích' : '❤️ Đã thêm vào yêu thích');
}

function addToCart(id) {
    let cart = JSON.parse(localStorage.getItem('cart')) || [];
    const product = products.find(p => p.id === id);
    cart.push(product);
    localStorage.setItem('cart', JSON.stringify(cart));
    alert(`✅ Đã thêm ${product.name} vào giỏ hàng!`);
}

// Khởi chạy
renderDetail();
</script>
</body>
</html>
