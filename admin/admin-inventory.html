<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kho hàng - VacuumStore Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body class="bg-gray-100 font-sans">

<div class="flex h-screen">
    <!-- Sidebar -->
    <div class="w-72 sidebar text-white p-6 flex flex-col" style="background: linear-gradient(180deg, #1e2937, #0f172a);">
        <div class="flex items-center gap-3 mb-10 px-3">
            <i class="fa-solid fa-robot text-4xl"></i>
            <h1 class="text-3xl font-bold">VacuumStore</h1>
        </div>
        <nav class="flex-1 space-y-2">
            <a href="index.html" class="flex items-center gap-3 px-5 py-4 hover:bg-white/10 rounded-2xl"><i class="fa-solid fa-house"></i> Dashboard</a>
            <a href="admin-orders.html" class="flex items-center gap-3 px-5 py-4 hover:bg-white/10 rounded-2xl"><i class="fa-solid fa-box"></i> Quản lý đơn hàng</a>
            <a href="admin-products.html" class="flex items-center gap-3 px-5 py-4 hover:bg-white/10 rounded-2xl"><i class="fa-solid fa-boxes-stacked"></i> Sản phẩm</a>
            <a href="admin-inventory.html" class="flex items-center gap-3 px-5 py-4 bg-white/10 rounded-2xl text-white"><i class="fa-solid fa-warehouse"></i> Kho hàng</a>
            <a href="admin-customers.html" class="flex items-center gap-3 px-5 py-4 hover:bg-white/10 rounded-2xl"><i class="fa-solid fa-users"></i> Khách hàng</a>
            <a href="admin-revenue.html" class="flex items-center gap-3 px-5 py-4 hover:bg-white/10 rounded-2xl">
    <i class="fa-solid fa-chart-line"></i> Doanh thu
</a>
        </nav>
    </div>

    <!-- Main Content -->
    <div class="flex-1 overflow-auto">
        <header class="bg-white shadow px-8 py-5 flex justify-between items-center">
            <h1 class="text-3xl font-bold">Quản lý Kho hàng</h1>
            <div class="relative">
                <input id="searchInput" type="text" placeholder="Tìm sản phẩm..." 
                       class="bg-gray-100 border border-gray-200 rounded-3xl px-5 py-3 pl-10 w-80 focus:outline-none">
                <i class="fa-solid fa-magnifying-glass absolute left-5 top-1/2 -translate-y-1/2 text-gray-400"></i>
            </div>
        </header>

        <div class="p-8">
            <div class="bg-white rounded-3xl shadow overflow-hidden">
                <table class="w-full">
                    <thead>
                        <tr class="border-b text-left text-gray-500">
                            <th class="px-8 py-5">Sản phẩm</th>
                            <th class="px-8 py-5">Thương hiệu</th>
                            <th class="px-8 py-5 text-right">Giá</th>
                            <th class="px-8 py-5 text-center">Tồn kho</th>
                            <th class="px-8 py-5 text-center">Trạng thái</th>
                            <th class="px-8 py-5 text-center">Hành động</th>
                        </tr>
                    </thead>
                    <tbody id="inventoryTable" class="text-sm"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
let products = JSON.parse(localStorage.getItem('products')) || [];

// Render bảng kho hàng
function renderInventory(filtered = '') {
    const tbody = document.getElementById('inventoryTable');
    tbody.innerHTML = '';

    let list = products;

    if (filtered) {
        const term = filtered.toLowerCase();
        list = list.filter(p => 
            (p.name && p.name.toLowerCase().includes(term)) || 
            (p.brand && p.brand.toLowerCase().includes(term))
        );
    }

    list.forEach((product, index) => {
        const stock = product.stock !== undefined ? product.stock : 50; // mặc định 50 nếu chưa có
        const status = stock > 10 ? 'Còn hàng' : stock > 0 ? 'Sắp hết' : 'Hết hàng';
        const statusColor = stock > 10 ? 'bg-green-100 text-green-700' : stock > 0 ? 'bg-yellow-100 text-yellow-700' : 'bg-red-100 text-red-700';

        const tr = document.createElement('tr');
        tr.className = 'border-b hover:bg-gray-50';
        tr.innerHTML = `
            <td class="px-8 py-5">
                <div class="flex items-center gap-3">
                    <img src="${product.images ? product.images[0] : product.img || 'https://picsum.photos/id/1015/60/60'}" class="w-12 h-12 object-cover rounded-2xl">
                    <div>
                        <p class="font-medium">${product.name}</p>
                    </div>
                </div>
            </td>
            <td class="px-8 py-5">${product.brand || 'Không có'}</td>
            <td class="px-8 py-5 text-right font-semibold">${product.price.toLocaleString('vi-VN')}đ</td>
            <td class="px-8 py-5 text-center">
                <input type="number" value="${stock}" 
                       onchange="updateStock(${index}, this.value)" 
                       class="w-20 text-center border border-gray-300 rounded-2xl py-2 focus:outline-none focus:border-cyan-500">
            </td>
            <td class="px-8 py-5 text-center">
                <span class="px-4 py-1 rounded-3xl text-xs font-medium ${statusColor}">${status}</span>
            </td>
            <td class="px-8 py-5 text-center">
                <button onclick="viewProductDetail(${index})" class="text-cyan-600 hover:underline">Chi tiết</button>
            </td>`;
        tbody.appendChild(tr);
    });
}

function updateStock(index, newStock) {
    if (products[index]) {
        products[index].stock = parseInt(newStock) || 0;
        localStorage.setItem('products', JSON.stringify(products));
    }
}

function viewProductDetail(index) {
    const p = products[index];
    alert(`Chi tiết sản phẩm:\n\nTên: ${p.name}\nThương hiệu: ${p.brand}\nGiá: ${p.price.toLocaleString('vi-VN')}đ\nTồn kho hiện tại: ${p.stock || 50}`);
}

// Tìm kiếm
document.getElementById('searchInput').addEventListener('input', (e) => {
    renderInventory(e.target.value);
});

// Khởi chạy
window.addEventListener('load', () => {
    renderInventory('');
});
</script>
</body>
</html>
