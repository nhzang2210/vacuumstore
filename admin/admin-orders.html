<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Đơn hàng - VacuumStore Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body class="bg-gray-100 font-sans">

<div class="flex h-screen">
    <!-- Sidebar (giống hệt index.html và admin-customers.html) -->
    <div class="w-72 sidebar text-white p-6 flex flex-col" style="background: linear-gradient(180deg, #1e2937, #0f172a);">
        <div class="flex items-center gap-3 mb-10 px-3">
            <i class="fa-solid fa-robot text-4xl"></i>
            <h1 class="text-3xl font-bold">VacuumStore</h1>
        </div>
        <nav class="flex-1 space-y-2">
            <a href="index.html" class="flex items-center gap-3 px-5 py-4 hover:bg-white/10 rounded-2xl">
                <i class="fa-solid fa-house"></i> Dashboard
            </a>
            <a href="admin-orders.html" class="flex items-center gap-3 px-5 py-4 bg-white/10 rounded-2xl text-white">
                <i class="fa-solid fa-box"></i> Quản lý đơn hàng
            </a>
            <a href="admin-products.html" class="flex items-center gap-3 px-5 py-4 hover:bg-white/10 rounded-2xl">
                <i class="fa-solid fa-boxes-stacked"></i> Sản phẩm
            </a>
            <a href="admin-inventory.html" class="flex items-center gap-3 px-5 py-4 hover:bg-white/10 rounded-2xl">
                <i class="fa-solid fa-warehouse"></i> Kho hàng
            </a>
            <a href="admin-customers.html" class="flex items-center gap-3 px-5 py-4 hover:bg-white/10 rounded-2xl">
                <i class="fa-solid fa-users"></i> Khách hàng
            </a>
        </nav>
    </div>

    <!-- Main -->
    <div class="flex-1 overflow-auto">
        <header class="bg-white shadow px-8 py-5 flex justify-between items-center">
            <h1 class="text-3xl font-bold">Quản lý Đơn hàng</h1>
            <div class="flex items-center gap-4">
                <button onclick="exportToExcel()" class="bg-green-600 text-white px-6 py-3 rounded-3xl flex items-center gap-2 hover:bg-green-700">
                    <i class="fa-solid fa-file-excel"></i> Xuất Excel
                </button>
                <input id="searchInput" placeholder="Tìm mã đơn / tên khách..." class="border border-gray-300 rounded-3xl px-5 py-3 w-80 focus:outline-none focus:border-cyan-500">
            </div>
        </header>

        <div class="p-8">
            <select id="statusFilter" class="border border-gray-300 rounded-3xl px-5 py-3 mb-6" onchange="filterOrders()">
                <option value="">Tất cả trạng thái</option>
                <option value="Đang xử lý">Đang xử lý</option>
                <option value="Đang giao">Đang giao</option>
                <option value="Hoàn thành">Hoàn thành</option>
                <option value="Đã hủy">Đã hủy</option>
            </select>

            <div class="bg-white rounded-3xl shadow overflow-hidden">
                <table class="w-full">
                    <thead>
                        <tr class="border-b text-left text-gray-500">
                            <th class="px-8 py-5">Mã đơn</th>
                            <th class="px-8 py-5">Khách hàng</th>
                            <th class="px-8 py-5">Ngày đặt</th>
                            <th class="px-8 py-5">Tổng tiền</th>
                            <th class="px-8 py-5">Shipper</th>
                            <th class="px-8 py-5">Trạng thái</th>
                            <th class="px-8 py-5 text-center">Hành động</th>
                        </tr>
                    </thead>
                    <tbody id="orderTable" class="text-sm"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- Modal -->
<div id="detailModal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center z-[9999]">
    <div class="bg-white rounded-3xl max-w-2xl w-full mx-4 max-h-[90vh] overflow-auto">
        <div class="p-8">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-2xl font-bold" id="modalOrderId"></h3>
                <button onclick="closeModal()" class="text-4xl text-gray-400 hover:text-gray-600">×</button>
            </div>
            <div id="modalContent"></div>
        </div>
    </div>
</div>

<script>
const shippers = [
    { name: "Nguyễn Văn Hải", phone: "0912 345 678" },
    { name: "Trần Thị Lan", phone: "0987 654 321" },
    { name: "Lê Minh Quân", phone: "0934 567 890" }
];

let orders = JSON.parse(localStorage.getItem('orders')) || [];
let products = JSON.parse(localStorage.getItem('products')) || [];   // ← Thêm dòng này

// Render bảng đơn hàng
function renderOrders(filtered) {
    const tbody = document.getElementById('orderTable');
    tbody.innerHTML = '';
    filtered.forEach(order => {
        const tr = document.createElement('tr');
        tr.className = 'border-b hover:bg-gray-50';
        tr.innerHTML = `
            <td class="px-8 py-5 font-medium">${order.id}</td>
            <td class="px-8 py-5">${order.customer || 'Chưa có tên'}</td>
            <td class="px-8 py-5 text-gray-500">${order.date}</td>
            <td class="px-8 py-5 font-semibold text-cyan-600">${order.total.toLocaleString('vi-VN')}đ</td>
            <td class="px-8 py-5">${order.shipper ? order.shipper.name + '<br><span class="text-xs text-gray-500">' + order.shipper.phone + '</span>' : '<span class="text-gray-400">Chưa gán</span>'}</td>
            <td class="px-8 py-5">
                <span class="px-5 py-1.5 rounded-3xl text-xs font-medium ${order.status === 'Hoàn thành' ? 'bg-green-100 text-green-700' : order.status === 'Đang giao' ? 'bg-blue-100 text-blue-700' : order.status === 'Đang xử lý' ? 'bg-yellow-100 text-yellow-700' : 'bg-red-100 text-red-700'}">
                    ${order.status}
                </span>
            </td>
            <td class="px-8 py-5 text-center">
                <button onclick="viewOrderDetail('${order.id}')" class="text-cyan-600 hover:underline font-medium">Chi tiết</button>
            </td>`;
        tbody.appendChild(tr);
    });
}

// Modal chi tiết
function viewOrderDetail(id) {
    const order = orders.find(o => o.id === id);
    if (!order) return;

    let itemsHTML = order.items.map(item => `
        <div class="flex justify-between py-3 border-b">
            <span>${item.name} × ${item.qty}</span>
            <span class="font-medium">${(item.price * item.qty).toLocaleString('vi-VN')}đ</span>
        </div>`).join('');

    const shipperOptions = shippers.map(s => `
        <option value="${s.name}" ${order.shipper && order.shipper.name === s.name ? 'selected' : ''}>${s.name} (${s.phone})</option>`).join('');

    const statusOptions = ['Đang xử lý','Đang giao','Hoàn thành','Đã hủy'].map(st => `
        <option value="${st}" ${order.status === st ? 'selected' : ''}>${st}</option>`).join('');

    const html = `
        <div class="space-y-6">
            <div class="grid grid-cols-2 gap-6">
                <div><p class="text-gray-500">Khách hàng</p><p class="font-semibold">${order.customer}</p></div>
                <div class="text-right"><p class="text-gray-500">Ngày đặt</p><p class="font-medium">${order.date}</p></div>
            </div>
            <div><p class="text-gray-500">Địa chỉ</p><p class="font-medium">${order.address || 'Chưa có'}</p></div>

            <!-- Chọn shipper -->
            <div>
                <p class="text-gray-500 mb-2">Giao cho shipper</p>
                <select id="shipperSelect" class="w-full border border-gray-300 rounded-2xl px-5 py-4">
                    <option value="">Chưa gán shipper</option>
                    ${shipperOptions}
                </select>
            </div>

            <!-- Chuyển đổi trạng thái -->
            <div>
                <p class="text-gray-500 mb-2">Trạng thái đơn hàng</p>
                <select id="statusSelect" class="w-full border border-gray-300 rounded-2xl px-5 py-4">
                    ${statusOptions}
                </select>
            </div>

            <div>
                <p class="text-gray-500 mb-3">Sản phẩm</p>
                ${itemsHTML}
            </div>

            <div class="flex gap-4">
                <button onclick="saveShipper('${order.id}')" class="flex-1 bg-cyan-600 text-white py-4 rounded-3xl">Lưu shipper</button>
                <button onclick="updateStatus('${order.id}')" class="flex-1 bg-emerald-600 text-white py-4 rounded-3xl">Cập nhật trạng thái</button>
                <button onclick="printInvoice('${order.id}')" class="flex-1 border border-gray-300 py-4 rounded-3xl flex items-center justify-center gap-2">
                    <i class="fa-solid fa-print"></i> In hóa đơn
                </button>
            </div>
        </div>`;

    document.getElementById('modalContent').innerHTML = html;
    document.getElementById('modalOrderId').innerHTML = `<span class="text-cyan-600">${order.id}</span>`;
    document.getElementById('detailModal').classList.remove('hidden');
}

// Cập nhật trạng thái + TRỪ TỒN KHO khi hoàn thành
function updateStatus(id) {
    const order = orders.find(o => o.id === id);
    if (!order) return;

    const oldStatus = order.status;
    const newStatus = document.getElementById('statusSelect').value;

    // Nếu chuyển sang "Hoàn thành" thì trừ tồn kho
    if (newStatus === 'Hoàn thành' && oldStatus !== 'Hoàn thành') {
        if (order.items && order.items.length > 0) {
            order.items.forEach(item => {
                const product = products.find(p => 
                    p.name === item.name || (p.id && p.id === item.id)
                );
                if (product) {
                    const qtySold = parseInt(item.qty || item.quantity || 1);
                    product.stock = (product.stock || 50) - qtySold;
                    if (product.stock < 0) product.stock = 0;
                }
            });
            localStorage.setItem('products', JSON.stringify(products));
        }
    }

    // Cập nhật trạng thái
    order.status = newStatus;
    localStorage.setItem('orders', JSON.stringify(orders));

    closeModal();
    filterOrders();
    alert("✅ Đã cập nhật trạng thái đơn hàng!");
    // Nếu trừ kho thì thông báo thêm
    if (newStatus === 'Hoàn thành' && oldStatus !== 'Hoàn thành') {
        console.log('✅ Đã trừ tồn kho cho đơn hàng hoàn thành');
    }
}

// Lưu shipper
function saveShipper(id) {
    const order = orders.find(o => o.id === id);
    const selectedName = document.getElementById('shipperSelect').value;
    if (selectedName) {
        order.shipper = shippers.find(s => s.name === selectedName);
    } else {
        order.shipper = null;
    }
    localStorage.setItem('orders', JSON.stringify(orders));
    closeModal();
    filterOrders();
    alert("✅ Đã gán shipper thành công!");
}

function printInvoice(id) {
    const order = orders.find(o => o.id === id);
    const printWin = window.open('', '_blank');
    printWin.document.write(`
        <div style="padding:40px; font-family:Arial; max-width:800px; margin:auto;">
            <h1 style="text-align:center;color:#0ea5e9;">VacuumStore</h1>
            <h2 style="text-align:center;">HÓA ĐƠN BÁN HÀNG</h2>
            <p><strong>Mã đơn:</strong> ${order.id}</p>
            <p><strong>Khách hàng:</strong> ${order.customer}</p>
            <p><strong>Ngày:</strong> ${order.date}</p>
            <hr>
            ${order.items.map(i => `<div style="display:flex;justify-content:space-between;"><span>${i.name} × ${i.qty}</span><span>${(i.price*i.qty).toLocaleString('vi-VN')}đ</span></div>`).join('')}
            <hr>
            <div style="font-size:1.4em;font-weight:bold;text-align:right;">Tổng: ${order.total.toLocaleString('vi-VN')}đ</div>
        </div>
    `);
    printWin.document.close();
    printWin.print();
}

function closeModal() {
    document.getElementById('detailModal').classList.add('hidden');
}

// Filter + Search
function filterOrders() {
    const search = document.getElementById('searchInput').value.toLowerCase().trim();
    const statusFilter = document.getElementById('statusFilter').value;

    let filtered = orders;

    if (search) {
        filtered = filtered.filter(o => 
            o.id.toLowerCase().includes(search) || 
            (o.customer && o.customer.toLowerCase().includes(search))
        );
    }

    if (statusFilter) {
        filtered = filtered.filter(o => o.status === statusFilter);
    }

    renderOrders(filtered);
}

// Xuất Excel
function exportToExcel() {
    if (orders.length === 0) return alert("Không có đơn hàng để xuất!");

    let csv = "Mã đơn,Khách hàng,Ngày đặt,Tổng tiền,Shipper,Trạng thái\n";
    orders.forEach(o => {
        csv += `${o.id},${o.customer || ''},${o.date},${o.total},${o.shipper ? o.shipper.name : ''},${o.status}\n`;
    });

    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = "don_hang_vacuumstore.csv";
    link.click();
}

// Khởi chạy
document.getElementById('searchInput').addEventListener('input', filterOrders);
document.getElementById('statusFilter').addEventListener('change', filterOrders);
renderOrders(orders);
</script>
</body>
</html>
