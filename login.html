<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - VacuumStore</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen">

    <div class="max-w-md w-full mx-4">
        <div class="flex justify-center mb-8">
            <div class="flex items-center gap-3">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-10 h-10 text-cyan-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.25">
                    <rect x="4" y="7" width="13" height="9" rx="2" ry="2" />
                    <path d="M17 12h4v4" />
                    <circle cx="8" cy="18" r="2" />
                    <line x1="16" y1="16" x2="20" y2="16" />
                    <path d="M9 4v3" />
                </svg>
                <h1 class="text-3xl font-bold tracking-[-1px]"><span class="text-cyan-600">Vacuum</span>Store</h1>
            </div>
        </div>

        <div class="bg-white rounded-3xl shadow-xl p-10">
            <h2 class="text-3xl font-bold text-center mb-2">Đăng nhập</h2>
            <p class="text-gray-500 text-center mb-8">Chào mừng bạn quay lại VacuumStore</p>

            <div id="errorMessage" class="hidden bg-red-100 text-red-600 p-4 rounded-2xl mb-6 text-sm"></div>

            <div class="space-y-6">
                <div>
                    <label class="block text-sm text-gray-600 mb-2">Tài khoản / Email / Số điện thoại</label>
                    <input id="email" type="text" placeholder="example@email.com hoặc SĐT Shipper" class="w-full border border-gray-300 rounded-2xl px-5 py-4 focus:outline-none focus:border-cyan-600">
                </div>
                <div>
                    <label class="block text-sm text-gray-600 mb-2">Mật khẩu</label>
                    <input id="password" type="password" placeholder="••••••••" class="w-full border border-gray-300 rounded-2xl px-5 py-4 focus:outline-none focus:border-cyan-600">
                </div>

                <button onclick="login()" id="loginBtn"
                        class="w-full bg-cyan-600 hover:bg-cyan-700 text-white py-4 rounded-3xl font-semibold text-lg transition">
                    Đăng nhập
                </button>

                <p class="text-center text-sm text-gray-600">
                    Chưa có tài khoản? 
                    <a href="register.html" class="text-cyan-600 font-medium hover:underline">Đăng ký ngay</a>
                </p>
            </div>
        </div>
    </div>

<script>
async function login() {
    const usernameInput = document.getElementById('email').value.trim();
    const passwordInput = document.getElementById('password').value;
    const errorEl = document.getElementById('errorMessage');
    
    errorEl.classList.add('hidden');

    if (!usernameInput || !passwordInput) {
        errorEl.textContent = "Vui lòng nhập tài khoản và mật khẩu";
        errorEl.classList.remove('hidden');
        return;
    }

    const btn = document.getElementById('loginBtn');
    btn.disabled = true;
    btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Đang xác thực...`;

    // ========================================================
    // BƯỚC 1: KIỂM TRA QUYỀN SHIPPER TRƯỚC (Để tránh bị chặn bởi API Node)
    // ========================================================
    const registeredShippers = [
        { name: "Nguyễn Văn Hải", phone: "0912345678", pass: "123456" },
        { name: "Trần Thị Lan", phone: "0987654321", pass: "123456" },
        { name: "Lê Minh Quân", phone: "0934567890", pass: "123456" }
    ];

    const matchedShipper = registeredShippers.find(s => s.phone === usernameInput && s.pass === passwordInput);
    
    if (matchedShipper) {
        const shipperUser = { name: matchedShipper.name, phone: matchedShipper.phone, role: "shipper" };
        
        // Lưu cả 2 key 'user' và 'currentUser' để đồng bộ với tất cả các trang
        localStorage.setItem('user', JSON.stringify(shipperUser));
        localStorage.setItem('currentUser', JSON.stringify(shipperUser));
        localStorage.setItem('token', 'mock-shipper-token-67890');
        
        alert(`🚴 Khởi hành đi giao hàng thôi, tài xế ${matchedShipper.name}!`);
        window.location.href = "shipper-dashboard.html"; // Chuyển hướng ngay sang trang danh sách đơn của shipper
        return; // Ngắt hàm luôn, không gửi request lên backend nữa
    }

    // ========================================================
    // BƯỚC 2: KIỂM TRA QUYỀN ADMIN (Nếu thông tin nhập khớp admin)
    // ========================================================
    if (usernameInput === "admin@gmail.com" && passwordInput === "admin123") {
        const adminUser = { name: "Quản trị viên", email: usernameInput, role: "admin" };
        localStorage.setItem('user', JSON.stringify(adminUser));
        localStorage.setItem('currentUser', JSON.stringify(adminUser));
        localStorage.setItem('token', 'mock-admin-token-12345');
        
        alert("🎉 Đăng nhập Admin thành công!");
        window.location.href = "admin/index.html";
        return;
    }

    // ========================================================
    // BƯỚC 3: GỬI LÊN NODEJS SERVER CHO KHÁCH HÀNG THƯỜNG
    // ========================================================
    try {
        const res = await fetch('http://localhost:3000/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: usernameInput, password: passwordInput })
        });

        const data = await res.json();

        if (res.ok) {
            localStorage.setItem('token', data.token);
            localStorage.setItem('user', JSON.stringify(data.user));
            localStorage.setItem('currentUser', JSON.stringify(data.user));

            alert("🎉 Đăng nhập thành công!");
            window.location.href = "user-profile.html";
        } else {
            errorEl.textContent = data.message || "Tài khoản hoặc mật khẩu không chính xác";
            errorEl.classList.remove('hidden');
        }
    } catch (err) {
        errorEl.textContent = "Không thể kết nối đến máy chủ Backend (NodeJS). Vui lòng kiểm tra lệnh 'node server.js' đã chạy chưa.";
        errorEl.classList.remove('hidden');
    } finally {
        btn.disabled = false;
        btn.textContent = "Đăng nhập";
    }
}
</script>
</body>
</html>
