<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tài khoản của tôi - VacuumStore</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Plus Jakarta Sans', system-ui, sans-serif; 
            background: radial-gradient(circle at top right, rgba(14, 165, 233, 0.05), transparent 40%),
                        radial-gradient(circle at bottom left, rgba(6, 182, 212, 0.03), transparent 50%),
                        #f8fafc;
        }
        /* Hiệu ứng kính mờ Glassmorphism */
        .glass-card {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.6);
        }
        .glass-nav {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-b: 1px solid rgba(241, 245, 249, 0.8);
        }
        .hero-gradient {
            background: linear-gradient(135deg, rgba(14, 165, 233, 0.85), rgba(6, 182, 212, 0.85));
            backdrop-filter: blur(8px);
        }
        .tab-item {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .tab-item.active {
            background: linear-gradient(135deg, rgba(14, 165, 233, 0.1), rgba(6, 182, 212, 0.05));
            color: #0369a1;
            font-weight: 600;
            border-left: 4px solid #0ea5e9;
            padding-left: 14px;
        }
        /* Custom scrollbar siêu mảnh hiện đại */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        /* ==================== ĐỊNH DẠNG ĐẶC BIỆT KHI IN HÓA ĐƠN ĐƠN TRANG A4 ==================== */
        @media print {
            /* Ẩn toàn bộ giao diện website và modal gốc */
            body * {
                visibility: hidden;
            }
            /* Chỉ hiển thị khu vực hóa đơn bản in */
            #invoicePrintArea, #invoicePrintArea * {
                visibility: visible;
            }
            #invoicePrintArea {
                position: absolute;
                left: 0;
                top: 0;
                width: 100% !important;
                max-width: 100% !important;
                padding: 0 !important;
                margin: 0 !important;
                background: white !important;
                color: black !important;
            }
            /* Ép kích thước chuẩn 1 trang dọc A4, loại bỏ lề thừa của trình duyệt */
            @page {
                size: A4 portrait;
                margin: 1.2cm !important;
            }
        }
    </style>
</head>
<body class="text-slate-800 min-h-screen">

<nav class="glass-nav sticky top-0 z-50 transition-all duration-300">
    <div class="max-w-7xl mx-auto px-6">
        <div class="flex items-center justify-between h-16">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-sky-500/10 rounded-xl flex items-center justify-center text-sky-600">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                        <rect x="4" y="7" width="13" height="9" rx="2" ry="2" />
                        <path d="M17 12h4v4" />
                        <circle cx="8" cy="18" r="2" />
                        <line x1="16" y1="16" x2="20" y2="16" />
                        <path d="M9 4v3" />
                    </svg>
                </div>
                <h1 class="text-2xl font-extrabold tracking-tight text-slate-900"><span class="text-sky-500">Vacuum</span>Store</h1>
            </div>
            <a href="index.html" class="text-sm font-semibold text-sky-600 hover:text-sky-700 bg-sky-500/5 hover:bg-sky-500/10 px-4 py-2 rounded-xl transition flex items-center gap-2">
                <i class="fa-solid fa-arrow-left text-xs"></i> Về trang chủ
            </a>
        </div>
    </div>
</nav>

<div class="max-w-7xl mx-auto px-6 mt-6">
    <div class="hero-gradient text-white rounded-[2rem] p-8 md:p-10 shadow-lg shadow-sky-500/10 relative overflow-hidden">
        <div class="absolute -right-10 -top-10 w-40 h-40 bg-white/10 rounded-full blur-2xl"></div>
        <div class="absolute -left-10 -bottom-10 w-40 h-40 bg-cyan-400/20 rounded-full blur-3xl"></div>
        
        <div class="flex flex-col sm:flex-row items-center gap-6 relative z-10 text-center sm:text-left">
            <div class="w-20 h-20 bg-white/20 backdrop-blur-md rounded-2xl flex items-center justify-center text-3xl font-extrabold shadow-inner border border-white/30" id="avatarLetter">👤</div>
            <div>
                <p class="text-3xl font-extrabold tracking-tight" id="displayName">Đang tải...</p>
                <p class="text-sky-100/80 text-sm font-medium mt-1 flex items-center justify-center sm:justify-start gap-1.5">
                    <i class="fa-regular fa-envelope"></i> <span id="displayEmail">loading@gmail.com</span>
                </p>
            </div>
        </div>
    </div>
</div>

<div class="max-w-7xl mx-auto px-6 py-8 flex flex-col lg:flex-row gap-8">
    
    <div class="w-full lg:w-72 glass-card rounded-[2rem] shadow-sm p-6 h-fit sticky top-24">
        <div class="space-y-1.5">
            <div onclick="switchTab(0)" class="tab-item flex items-center gap-3 px-4 py-3.5 rounded-xl cursor-pointer hover:bg-slate-50 text-slate-600 font-medium text-sm" id="tab0">
                <i class="fa-regular fa-user text-base w-5"></i> Thông tin cá nhân
            </div>
            <div onclick="switchTab(1)" class="tab-item flex items-center gap-3 px-4 py-3.5 rounded-xl cursor-pointer hover:bg-slate-50 text-slate-600 font-medium text-sm active" id="tab1">
                <i class="fa-solid fa-receipt text-base w-5"></i> Đơn hàng của tôi
            </div>
            <div onclick="switchTab(3)" class="tab-item flex items-center gap-3 px-4 py-3.5 rounded-xl cursor-pointer hover:bg-slate-50 text-slate-600 font-medium text-sm" id="tab3">
                <i class="fa-regular fa-heart text-base w-5"></i> Sản phẩm yêu thích
            </div>
        </div>

        <div onclick="logout()" class="mt-8 pt-4 border-t border-slate-100 text-red-500 hover:text-red-600 font-semibold text-sm cursor-pointer flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-red-50/50 transition">
            <i class="fa-solid fa-right-from-bracket text-base w-5"></i> Đăng xuất tài khoản
        </div>
    </div>

    <div class="flex-1 min-w-0">
        
        <div id="tab-0" class="tab-content hidden animate-fade-in">
            <div class="glass-card rounded-[2rem] shadow-sm p-8 max-w-2xl">
                <h2 class="text-2xl font-extrabold tracking-tight text-slate-900 mb-6">Thông tin cá nhân</h2>
                <div class="space-y-5">
                    <div>
                        <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1.5">Họ và tên</label>
                        <input id="profileName" type="text" class="w-full bg-slate-50/50 border border-slate-200 focus:border-sky-500 focus:bg-white rounded-xl px-4 py-3 text-sm font-medium focus:outline-none transition-all duration-200">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1.5">Số điện thoại</label>
                        <input id="profilePhone" type="tel" class="w-full bg-slate-50/50 border border-slate-200 focus:border-sky-500 focus:bg-white rounded-xl px-4 py-3 text-sm font-medium focus:outline-none transition-all duration-200">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1.5">Email liên hệ</label>
                        <input id="profileEmail" type="email" class="w-full bg-slate-50/50 border border-slate-200 focus:border-sky-500 focus:bg-white rounded-xl px-4 py-3 text-sm font-medium focus:outline-none transition-all duration-200">
                    </div>
                    <button onclick="saveProfile()" class="bg-gradient-to-r from-sky-500 to-cyan-500 hover:from-sky-600 hover:to-cyan-600 text-white px-8 py-3.5 rounded-xl text-sm font-bold shadow-md shadow-sky-500/10 transition mt-2">
                        Lưu thay đổi hồ sơ
                    </button>
                </div>
            </div>
        </div>

        <div id="tab-1" class="tab-content animate-fade-in">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-extrabold tracking-tight text-slate-900">Đơn hàng của tôi</h2>
                <span class="bg-sky-500/10 text-sky-600 text-xs font-bold px-3 py-1.5 rounded-lg" id="orderCountBadge">0 đơn hàng</span>
            </div>
            <div id="ordersList" class="space-y-4">
                </div>
        </div>

    

        <div id="tab-3" class="tab-content hidden animate-fade-in">
            <div class="glass-card rounded-[2rem] shadow-sm p-8">
                <h2 class="text-2xl font-extrabold tracking-tight text-slate-900 mb-6">Sản phẩm yêu thích</h2>
                <div id="wishlistGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6"></div>
            </div>
        </div>
    </div>
</div>

<div id="orderDetailModal" class="hidden fixed inset-0 bg-slate-900/40 backdrop-blur-md flex items-center justify-center z-[9999] p-4">
    <div class="bg-white/90 backdrop-blur-xl border border-white rounded-[2.5rem] max-w-3xl w-full overflow-hidden shadow-2xl p-6 md:p-8 relative max-h-[90vh] overflow-y-auto">
        <button onclick="closeOrderDetail()" class="absolute right-6 top-6 w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 flex items-center justify-center text-slate-400 hover:text-slate-600 transition z-50">
            <i class="fa-solid fa-xmark text-sm"></i>
        </button>
        <div id="modalDetailContent">
            </div>
    </div>
</div>

<div id="invoicePrintArea"></div>


<script>
// ====================== TRÍCH XUẤT VÀ KIỂM TRA TÀI KHOẢN HỆ THỐNG ======================
const loggedInUser = JSON.parse(localStorage.getItem('user'));
let orders = JSON.parse(localStorage.getItem('orders')) || [];
let addresses = JSON.parse(localStorage.getItem('addresses')) || [];
let wishlist = JSON.parse(localStorage.getItem('wishlist')) || [];

if (!loggedInUser) {
    alert("Phiên làm việc đã kết thúc. Vui lòng đăng nhập để tiếp tục!");
    window.location.href = "index.html";
}

function switchTab(n) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
    document.getElementById('tab-' + n).classList.remove('hidden');
    document.querySelectorAll('.tab-item').forEach((el, i) => el.classList.toggle('active', i === n));
}

function initProfileData() {
    if (!loggedInUser) return;
    const activeName = loggedInUser.fullName || loggedInUser.name || loggedInUser.username || "Thành viên";
    
    document.getElementById('displayName').textContent = activeName;
    document.getElementById('displayEmail').textContent = loggedInUser.email || "Chưa cập nhật email";
    document.getElementById('avatarLetter').textContent = activeName.charAt(0).toUpperCase();

    document.getElementById('profileName').value = activeName;
    document.getElementById('profilePhone').value = loggedInUser.phone || "";
    document.getElementById('profileEmail').value = loggedInUser.email || "";
}

// ====================== HIỂN THỊ DANH SÁCH ĐƠN HÀNG CÁ NHÂN ======================
function renderMyOrders() {
    const container = document.getElementById('ordersList');
    container.innerHTML = '';
    if (!loggedInUser) return;
    const activeName = loggedInUser.fullName || loggedInUser.name || loggedInUser.username;

    const userOrders = orders.filter(order => {
        return order.customer === activeName || (loggedInUser.phone && order.phone === loggedInUser.phone);
    });

    document.getElementById('orderCountBadge').textContent = `${userOrders.length} đơn hàng`;

    if (userOrders.length === 0) {
        container.innerHTML = `
            <div class="text-center py-12 glass-card rounded-2xl border border-dashed border-slate-200">
                <i class="fa-solid fa-box-open text-4xl text-slate-300 block mb-3"></i>
                <p class="text-sm font-medium text-slate-400">Bạn chưa thực hiện đơn đặt hàng nào.</p>
            </div>`;
        return;
    }

    userOrders.forEach(order => {
        let statusBadge = "bg-amber-50 text-amber-600 border border-amber-100";
        if (order.status === 'Hoàn thành') statusBadge = "bg-emerald-50 text-emerald-600 border border-emerald-100";
        if (order.status === 'Đang giao') statusBadge = "bg-sky-50 text-sky-600 border border-sky-100";

        const html = `
            <div onclick="showOrderDetail('${order.id}')" class="glass-card rounded-2xl p-5 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 hover:border-sky-400 hover:shadow-lg hover:shadow-sky-500/[0.02] cursor-pointer transition-all duration-300">
                <div>
                    <div class="font-bold text-slate-900 text-base flex items-center gap-2">
                        <span>${order.id}</span>
                        <span class="text-xs px-2 py-0.5 rounded-md font-medium ${statusBadge}">${order.status || 'Đang xử lý'}</span>
                    </div>
                    <div class="text-xs text-slate-400 font-medium mt-1.5 flex items-center gap-1.5"><i class="fa-regular fa-calendar"></i> Ngày tạo đơn: ${order.date || 'Vừa xong'}</div>
                </div>
                <div class="sm:text-right w-full sm:w-auto border-t sm:border-t-0 pt-3 sm:pt-0 flex sm:flex-col justify-between items-center sm:items-end">
                    <span class="text-xs text-slate-400 font-bold sm:hidden">Tổng tiền:</span>
                    <div class="text-sky-600 font-black text-xl">${order.total.toLocaleString('vi-VN')}đ</div>
                </div>
            </div>`;
        container.innerHTML += html;
    });
}

// ====================== MODAL XEM CHI TIẾT ĐƠN HÀNG (MÀU XANH MỜ HIỆN ĐẠI) ======================
function showOrderDetail(id) {
    const order = orders.find(o => o.id === id);
    if (!order) return alert("Không tìm thấy thông tin chi tiết đơn hàng.");

    const status = order.status || 'Đang xử lý';
    const s1 = true;
    const s2 = (status === 'Đang giao' || status === 'Hoàn thành');
    const s3 = (status === 'Hoàn thành');

    let itemsHTML = '';
    order.items.forEach(item => {
        const qty = item.qty || item.quantity || 1;
        itemsHTML += `
            <div class="flex justify-between items-center py-3.5 border-b border-slate-100 text-slate-700 text-sm">
                <span class="font-medium">${item.name} <span class="text-slate-400 text-xs font-normal ml-1">× ${qty}</span></span>
                <span class="font-bold text-slate-900">${(parseInt(item.price) * qty).toLocaleString('vi-VN')}đ</span>
            </div>`;
    });

    let codDisplay = order.total.toLocaleString('vi-VN') + 'đ';
    if ((order.paymentMethod === "Chuyển khoản" || order.paymentMethod === "bank") && order.total > 0) {
        codDisplay = "0đ (Đã trả qua QR)";
    }

    const modalHTML = `
        <div class="flex justify-between items-center max-w-md mx-auto mb-10 mt-4 relative">
            <div class="flex flex-col items-center z-10">
                <div class="w-7 h-7 rounded-full ${s1 ? 'bg-sky-500 text-white shadow-md shadow-sky-500/20' : 'bg-slate-200 text-slate-400'} flex items-center justify-center font-bold text-xs"><i class="fa-solid fa-check text-[10px]"></i></div>
                <span class="text-[10px] font-bold mt-2 ${s1 ? 'text-sky-600' : 'text-slate-400'} tracking-wider">ĐANG XỬ LÝ</span>
            </div>
            <div class="flex-1 h-0.5 mx-1 ${s2 ? 'bg-sky-500' : 'bg-slate-200'}"></div>
            
            <div class="flex flex-col items-center z-10">
                <div class="w-7 h-7 rounded-full ${s2 ? 'bg-sky-500 text-white shadow-md shadow-sky-500/20' : 'bg-slate-200 text-slate-400'} flex items-center justify-center font-bold text-xs">${s3 ? '<i class="fa-solid fa-check text-[10px]"></i>' : '2'}</div>
                <span class="text-[10px] font-bold mt-2 ${s2 ? 'text-sky-600' : 'text-slate-400'} tracking-wider">ĐANG GIAO</span>
            </div>
            <div class="flex-1 h-0.5 mx-1 ${s3 ? 'bg-sky-500' : 'bg-slate-200'}"></div>
            
            <div class="flex flex-col items-center z-10">
                <div class="w-7 h-7 rounded-full ${s3 ? 'bg-sky-500 text-white shadow-md shadow-sky-500/20' : 'bg-slate-200 text-slate-400'} flex items-center justify-center font-bold text-xs">3</div>
                <span class="text-[10px] font-bold mt-2 ${s3 ? 'text-sky-600' : 'text-slate-400'} tracking-wider">HOÀN THÀNH</span>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-12 gap-8">
            <div class="md:col-span-7 space-y-4 text-sm">
                <div>
                    <h4 class="text-slate-400 font-bold text-[10px] tracking-wider uppercase">Mã số đơn hàng</h4>
                    <p class="font-extrabold text-lg text-slate-900 mt-0.5">${order.id}</p>
                </div>
                <div>
                    <h4 class="text-slate-400 font-bold text-[10px] tracking-wider uppercase">Thời gian lập đơn</h4>
                    <p class="font-semibold text-slate-700 mt-0.5">${order.date || 'Đang xử lý...'}</p>
                </div>
                <div>
                    <h4 class="text-slate-400 font-bold text-[10px] tracking-wider uppercase">Địa điểm nhận hàng</h4>
                    <p class="font-semibold text-slate-700 mt-0.5 leading-relaxed">${order.address || 'Tại shop'}</p>
                </div>
                <div>
                    <h4 class="text-slate-400 font-bold text-[10px] tracking-wider uppercase mb-1.5">Đối tác vận chuyển</h4>
                    <div class="flex items-center gap-2.5 bg-slate-50 border border-slate-100 p-3 rounded-xl w-fit">
                        <div class="text-xl">⚡</div>
                        <div>
                            <p class="font-bold text-slate-800 text-xs">VacuumStore Express</p>
                            <p class="text-[11px] text-slate-400 font-medium">Trạng thái: Đang chuẩn bị</p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="md:col-span-5 bg-sky-500/[0.03] border border-sky-500/10 rounded-2xl p-5 flex flex-col justify-between">
                <div>
                    <h3 class="font-bold text-slate-900 text-xs tracking-wider uppercase border-b border-sky-500/5 pb-2 mb-3">Tóm tắt chi phí</h3>
                    <div class="space-y-2.5 text-xs font-medium border-b border-sky-500/5 pb-3">
                        <div class="flex justify-between text-slate-500"><span>Tiền hàng</span><span>${order.total.toLocaleString('vi-VN')}đ</span></div>
                        <div class="flex justify-between text-slate-500"><span>Giao hàng</span><span class="text-emerald-600 font-bold">Miễn phí</span></div>
                    </div>
                    <div class="mt-3">
                        <span class="text-[11px] text-slate-400 font-bold block">Tổng tiền thực tế đơn hàng</span>
                        <span class="text-xl font-extrabold text-slate-900 block mt-0.5">${order.total.toLocaleString('vi-VN')}đ</span>
                        
                        <span class="text-[11px] text-sky-600 font-bold block mt-3">Cần trả tiền mặt (COD) khi nhận</span>
                        <span class="text-lg font-black text-sky-600 block">${codDisplay}</span>
                    </div>
                </div>
                <button onclick="printInvoice('${order.id}')" class="w-full bg-slate-900 hover:bg-sky-600 text-white font-bold py-3 rounded-xl flex items-center justify-center gap-2 text-xs transition mt-4 shadow-sm">
                    <i class="fa-solid fa-print"></i> Tải / In hóa đơn
                </button>
            </div>
        </div>

        <div class="mt-6">
            <h3 class="font-bold text-slate-400 text-[10px] tracking-wider uppercase mb-2">Giỏ hàng chi tiết</h3>
            <div class="max-h-36 overflow-y-auto border border-slate-100 rounded-xl px-4 bg-slate-50/30">
                ${itemsHTML}
            </div>
        </div>

        <div class="flex justify-end gap-3 mt-8 pt-4 border-t border-slate-100">
            <button onclick="closeOrderDetail()" class="px-6 py-2.5 border border-slate-200 hover:bg-slate-50 text-slate-600 rounded-xl font-bold text-xs transition">Đóng lại</button>
            <button onclick="callShipper()" class="px-6 py-2.5 bg-emerald-500 hover:bg-emerald-600 text-white rounded-xl font-bold text-xs transition flex items-center gap-1.5 shadow-md shadow-emerald-500/10"><i class="fa-solid fa-phone"></i> Hỗ trợ vận chuyển</button>
        </div>`;

    document.getElementById('modalDetailContent').innerHTML = modalHTML;
    document.getElementById('orderDetailModal').classList.remove('hidden');
}

function closeOrderDetail() { document.getElementById('orderDetailModal').classList.add('hidden'); }
function callShipper() { alert("📞 Đang liên hệ tổng đài viên giải quyết vận chuyển..."); }

// ====================== PHƯƠNG THỨC XUẤT HÓA ĐƠN GỌN GÀNG TRONG 1 TRANG A4 ======================
function printInvoice(id) {
    const order = orders.find(o => o.id === id);
    if (!order) return;

    let itemsRowsHTML = '';
    order.items.forEach((item, index) => {
        const qty = item.qty || item.quantity || 1;
        const price = parseInt(item.price);
        itemsRowsHTML += `
            <tr style="border-bottom: 1px solid #e2e8f0;">
                <td style="padding: 10px 0; text-align: center;">${index + 1}</td>
                <td style="padding: 10px 0; font-weight: 500;">${item.name}</td>
                <td style="padding: 10px 0; text-align: center;">${qty}</td>
                <td style="padding: 10px 0; text-align: right;">${price.toLocaleString('vi-VN')}đ</td>
                <td style="padding: 10px 0; text-align: right; font-weight: 600;">${(price * qty).toLocaleString('vi-VN')}đ</td>
            </tr>`;
    });

    let paymentStatusText = "Thanh toán tiền mặt khi nhận hàng (COD)";
    if (order.paymentMethod === "Chuyển khoản" || order.paymentMethod === "bank") {
        paymentStatusText = "Chuyển khoản qua mã QR (Đã thanh toán)";
    }

// ====================== ĐỊA CHỈ VÀ SẢN PHẨM ƯU THÍCH (GIỮ NGUYÊN) ======================
function renderAddresses() {
    const container = document.getElementById('addressList');
    container.innerHTML = '';
    if (addresses.length === 0) {
        container.innerHTML = `<p class="text-center py-6 text-slate-400 text-sm font-medium">Bạn chưa cấu hình địa chỉ giao nhận nào.</p>`;
        return;
    }
    addresses.forEach((addr, index) => {
        const html = `
            <div class="border border-slate-100 rounded-2xl p-5 flex justify-between items-center bg-slate-50/20">
                <div>
                    <p class="font-bold text-slate-800 text-sm flex items-center gap-2">
                        <span>${addr.name}</span>
                        ${addr.isDefault ? '<span class="text-[10px] bg-emerald-100 text-emerald-700 font-bold px-2 py-0.5 rounded-md">Mặc định</span>' : ''}
                    </p>
                    <p class="text-slate-500 text-xs mt-1.5">${addr.detail}</p>
                </div>
                <div class="flex gap-3 font-bold text-xs text-sky-600">
                    <button onclick="setDefaultAddress(${index})" class="hover:text-sky-700">Mặc định</button>
                    <button onclick="deleteAddress(${index})" class="text-red-500 hover:text-red-600">Xóa</button>
                </div>
            </div>`;
        container.innerHTML += html;
    });
}

function showAddAddressModal() {
    document.getElementById('addressModalTitle').textContent = 'Thêm địa chỉ mới';
    document.getElementById('addressName').value = '';
    document.getElementById('addressDetail').value = '';
    document.getElementById('addressModal').classList.remove('hidden');
}
function closeAddressModal() { document.getElementById('addressModal').classList.add('hidden'); }

function saveAddress() {
    const name = document.getElementById('addressName').value.trim();
    const detail = document.getElementById('addressDetail').value.trim();
    if (!name || !detail) return alert("Vui lòng nhập đầy đủ thông tin!");

    addresses.push({ name, detail, isDefault: addresses.length === 0 });
    localStorage.setItem('addresses', JSON.stringify(addresses));
    closeAddressModal();
    renderAddresses();
}

function deleteAddress(index) {
    if (confirm("Xóa bỏ vĩnh viễn địa chỉ giao hàng này?")) {
        addresses.splice(index, 1);
        localStorage.setItem('addresses', JSON.stringify(addresses));
        renderAddresses();
    }
}

function setDefaultAddress(index) {
    addresses.forEach(a => a.isDefault = false);
    addresses[index].isDefault = true;
    localStorage.setItem('addresses', JSON.stringify(addresses));
    renderAddresses();
}

function renderWishlist() {
    const container = document.getElementById('wishlistGrid');
    container.innerHTML = '';
    if (wishlist.length === 0) {
        container.innerHTML = `<p class="col-span-full text-center py-8 text-slate-400 text-sm font-medium">Danh mục sản phẩm ưa thích trống.</p>`;
        return;
    }
    wishlist.forEach((product, index) => {
        const card = `
            <div class="bg-white border border-slate-100 rounded-2xl overflow-hidden hover:shadow-lg transition-all duration-300">
                <img src="${product.img || 'https://picsum.photos/id/1015/400/400'}" class="w-full h-40 object-cover">
                <div class="p-4">
                    <p class="text-[10px] text-slate-400 font-bold uppercase tracking-wider">${product.brand || 'Vacuum'}</p>
                    <h3 class="font-bold text-slate-800 text-xs truncate mt-0.5">${product.name}</h3>
                    <p class="text-sky-600 font-extrabold text-base mt-1">${parseInt(product.price).toLocaleString('vi-VN')}đ</p>
                    <div class="flex gap-2 mt-3.5">
                        <button onclick="addToCartFromWishlist(${index})" class="flex-1 bg-slate-900 text-white py-2 rounded-lg text-[11px] font-bold hover:bg-sky-500 transition">Mua ngay</button>
                        <button onclick="removeFromWishlist(${index})" class="border border-red-100 text-red-500 px-2.5 py-2 rounded-lg text-xs hover:bg-red-50 transition"><i class="fa-solid fa-trash"></i></button>
                    </div>
                </div>
            </div>`;
        container.innerHTML += card;
    });
}

function addToCartFromWishlist(index) {
    let cart = JSON.parse(localStorage.getItem('cart')) || [];
    cart.push(wishlist[index]);
    localStorage.setItem('cart', JSON.stringify(cart));
    alert(`✅ Đã thêm sản phẩm vào giỏ hàng thành công!`);
}

function removeFromWishlist(index) {
    if (confirm("Xóa khỏi danh sách yêu thích?")) {
        wishlist.splice(index, 1);
        localStorage.setItem('wishlist', JSON.stringify(wishlist));
        renderWishlist();
    }
}

function saveProfile() {
    const name = document.getElementById('profileName').value.trim();
    const phone = document.getElementById('profilePhone').value.trim();
    const email = document.getElementById('profileEmail').value.trim();

    if (!name) return alert("Họ và tên không thể để trống!");

    loggedInUser.fullName = name;
    loggedInUser.name = name;
    loggedInUser.phone = phone;
    loggedInUser.email = email;

    localStorage.setItem('user', JSON.stringify(loggedInUser));
    alert("🎉 Hồ sơ cá nhân của bạn đã được cập nhật!");
    window.location.reload();
}

function logout() {
    if (confirm('Xác nhận đăng xuất khỏi hệ thống?')) {
        localStorage.removeItem('user');
        window.location.href = 'index.html';
    }
}

window.addEventListener('load', () => {
    initProfileData();
    renderMyOrders();
    renderAddresses();
    renderWishlist();
});
</script>
