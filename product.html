let currentCategory = '';

// Render sản phẩm
function renderProducts(filtered) {
    const grid = document.getElementById('productGrid');
    grid.innerHTML = '';
    filtered.forEach(p => {
        const mainImg = p.images && p.images.length > 0 ? p.images[0] : (p.img || "https://picsum.photos/id/1015/400/400");
        const card = `
            <div onclick="viewDetail(${p.id})" class="product-card bg-white rounded-3xl overflow-hidden cursor-pointer relative">
                <img src="${mainImg}" class="w-full h-64 object-cover" alt="${p.name}">
                <button onclick="event.stopImmediatePropagation(); toggleWishlist(${p.id});" class="absolute top-4 right-4 bg-white shadow-md w-9 h-9 rounded-2xl flex items-center justify-center hover:scale-110 transition z-10">
                    <i class="fa-solid fa-heart text-xl ${isInWishlist(p.id) ? 'text-red-500' : 'text-gray-400'}"></i>
                </button>
                <div class="p-5">
                    <p class="text-xs text-gray-500">${p.brand}</p>
                    <h3 class="font-semibold text-xl mb-2">${p.name}</h3>
                    <div class="flex justify-between items-end">
                        <span class="text-3xl font-bold text-cyan-600">${p.price.toLocaleString('vi-VN')}đ</span>
                        <span class="text-sm text-gray-500">${p.sold || 0} đã bán</span>
                    </div>
                    <button onclick="event.stopImmediatePropagation(); addToCart(${p.id});" class="mt-5 w-full bg-black text-white py-3.5 rounded-2xl hover:bg-cyan-600">
                        Thêm vào giỏ
                    </button>
                </div>
            </div>`;
        grid.innerHTML += card;
    });
}

// Filter & Sort
function filterAndSort() {
    let filtered = [...products];
    const search = document.getElementById('searchInput').value.toLowerCase().trim();
    if (search) filtered = filtered.filter(p => p.name.toLowerCase().includes(search) || p.brand.toLowerCase().includes(search));
    if (currentCategory) filtered = filtered.filter(p => p.category === currentCategory);
    const brand = document.getElementById('brandSelect').value;
    if (brand) filtered = filtered.filter(p => p.brand === brand);
    const sortMode = document.getElementById('sortSelect').value;
    if (sortMode === 'price-low') filtered.sort((a,b) => a.price - b.price);
    if (sortMode === 'price-high') filtered.sort((a,b) => b.price - a.price);
    if (sortMode === 'sold') filtered.sort((a,b) => (b.sold || 0) - (a.sold || 0));
    renderProducts(filtered);
}

function toggleCategory(btn, category) {
    document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('filter-active'));
    currentCategory = currentCategory === category ? '' : category;
    if (currentCategory) btn.classList.add('filter-active');
    filterAndSort();
}

function isInWishlist(id) {
    let wishlist = JSON.parse(localStorage.getItem('wishlist')) || [];
    return wishlist.some(item => item.id === id);
}

function toggleWishlist(id) {
    let wishlist = JSON.parse(localStorage.getItem('wishlist')) || [];
    const product = products.find(p => p.id === id);
    const index = wishlist.findIndex(item => item.id === id);
    if (index > -1) wishlist.splice(index, 1);
    else wishlist.push(product);
    localStorage.setItem('wishlist', JSON.stringify(wishlist));
    filterAndSort();
    alert(index > -1 ? '💔 Đã xóa khỏi yêu thích' : '❤️ Đã thêm vào yêu thích');
}

function addToCart(id) {
    let cart = JSON.parse(localStorage.getItem('cart')) || [];
    const product = products.find(p => p.id === id);
    cart.push(product);
    localStorage.setItem('cart', JSON.stringify(cart));
    document.getElementById('cartCount').textContent = cart.length;
    alert(`✅ Đã thêm ${product.name} vào giỏ hàng!`);
}

function viewDetail(id) {
    window.location.href = `detail.html?id=${id}`;
}

// ==================== NAVBAR FUNCTIONS ====================
function setActiveLink() {
    const currentPath = window.location.pathname;
    const currentSearch = window.location.search;
    document.querySelectorAll('.nav-link').forEach(link => {
        link.classList.remove('text-cyan-600', 'border-b-2', 'border-cyan-600', 'pb-1');
        const href = link.getAttribute('href');
        if ((href === 'index.html' && (currentPath.endsWith('index.html') || currentPath === '/' || currentPath === '')) ||
            (href === 'product.html' && currentPath.includes('product.html') && !currentSearch) ||
            (href.includes('?category=robot') && currentSearch.includes('category=robot')) ||
            (href.includes('?category=handheld') && currentSearch.includes('category=handheld')) ||
            (href === 'about.html' && currentPath.includes('about.html'))) {
            link.classList.add('text-cyan-600', 'border-b-2', 'border-cyan-600', 'pb-1');
        }
    });
}

function createDropdown(dropdownId, menuId, delay = 280) {
    const dropdown = document.getElementById(dropdownId);
    const menu = document.getElementById(menuId);
    let timeout;
    dropdown.addEventListener('mouseenter', () => {
        clearTimeout(timeout);
        menu.classList.remove('hidden');
        setTimeout(() => menu.classList.add('opacity-100'), 10);
    });
    dropdown.addEventListener('mouseleave', () => {
        timeout = setTimeout(() => {
            menu.classList.remove('opacity-100');
            setTimeout(() => menu.classList.add('hidden'), 200);
        }, delay);
    });
}

function updateUserDropdown() {
    const user = JSON.parse(localStorage.getItem('user'));
    const dropdown = document.getElementById('dropdownMenu');
    if (user) {
        dropdown.innerHTML = `
            <div class="px-6 py-3 border-b">
                <p class="font-medium">${user.name}</p>
                <p class="text-xs text-gray-500">${user.email}</p>
            </div>
            <a href="user-profile.html" class="flex items-center gap-3 px-6 py-4 hover:bg-gray-50"><i class="fa-solid fa-user"></i> Tài khoản của tôi</a>
            <a href="user-profile.html" class="flex items-center gap-3 px-6 py-4 hover:bg-gray-50"><i class="fa-solid fa-receipt"></i> Đơn hàng của tôi</a>
            <button onclick="logout()" class="flex items-center gap-3 px-6 py-4 hover:bg-gray-50 w-full text-left text-red-500"><i class="fa-solid fa-right-from-bracket"></i> Đăng xuất</button>
        `;
    } else {
        dropdown.innerHTML = `
            <a href="register.html" class="flex items-center gap-3 px-6 py-4 hover:bg-gray-50"><i class="fa-solid fa-user-plus"></i> Đăng ký</a>
            <a href="login.html" class="flex items-center gap-3 px-6 py-4 hover:bg-gray-50"><i class="fa-solid fa-right-to-bracket"></i> Đăng nhập</a>
        `;
    }
}

function logout() {
    if (confirm("Bạn có chắc muốn đăng xuất?")) {
        localStorage.removeItem('token');
        localStorage.removeItem('user');
        window.location.reload();
    }
}

// ==================== KHỞI CHẠY ====================
window.addEventListener('load', () => {
    renderProducts(products);
    document.getElementById('cartCount').textContent = (JSON.parse(localStorage.getItem('cart')) || []).length;

    // Event listeners
    document.getElementById('searchInput').addEventListener('input', filterAndSort);
    document.getElementById('sortSelect').addEventListener('change', filterAndSort);
    document.getElementById('brandSelect').addEventListener('change', filterAndSort);

    // Xử lý URL category
    const urlParams = new URLSearchParams(window.location.search);
    const urlCategory = urlParams.get('category');
    if (urlCategory === 'robot' || urlCategory === 'handheld') {
        currentCategory = urlCategory;
        document.querySelectorAll('.category-btn').forEach(btn => {
            if (btn.getAttribute('data-category') === urlCategory) btn.classList.add('filter-active');
        });
        filterAndSort();
    }

    // Navbar
    setActiveLink();
    createDropdown('supportDropdown', 'supportMenu', 280);
    createDropdown('userDropdown', 'dropdownMenu', 280);
    updateUserDropdown();
});
</script>
