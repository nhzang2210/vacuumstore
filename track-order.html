<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Theo dõi đơn hàng - VacuumStore</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body class="bg-gray-50">

<nav class="bg-white shadow-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-6">
        <div class="flex items-center justify-between h-16">
            <div class="flex items-center gap-3">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-10 h-10 text-cyan-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.25">
                    <rect x="4" y="7" width="13" height="9" rx="2" ry="2" />
                    <path d="M17 12h4v4" />
                    <circle cx="8" cy="18" r="2" />
                    <line x1="16" y1="16" x2="20" y2="16" />
                    <path d="M9 4v3" />
                </svg>
                <h1 class="text-3xl font-bold tracking-[-1px]"><span class="text-cyan-600">Vacuum</span>Store</h1>
            </div>
            <a href="index.html" class="text-cyan-600 font-medium">Về trang chủ</a>
        </div>
    </div>
</nav>

<div class="max-w-4xl mx-auto px-6 py-12">
    <h1 class="text-4xl font-bold text-center mb-8">Theo dõi đơn hàng</h1>

    <div class="bg-white rounded-3xl shadow p-8">
        <div class="flex gap-3 mb-8">
            <input id="orderCode" type="text" placeholder="Nhập mã đơn hàng (ví dụ: #VS20260422-7842)" 
                   class="flex-1 border border-gray-300 rounded-3xl px-6 py-4 focus:border-cyan-500 focus:outline-none">
            <button onclick="searchOrder()" class="bg-cyan-600 text-white px-10 rounded-3xl font-semibold hover:bg-cyan-700">Tra cứu</button>
        </div>

        <div id="result" class="hidden">
            <div class="p-6 bg-gray-50 rounded-3xl">
                <div class="flex justify-between">
                    <div>
                        <p class="text-sm text-gray-500">Mã đơn hàng</p>
                        <p class="text-2xl font-bold" id="modalOrderId"></p>
                    </div>
                    <div class="text-right">
                        <p class="text-sm text-gray-500">Trạng thái</p>
                        <p id="statusBadge" class="inline-block px-5 py-1 rounded-full text-sm font-medium"></p>
                    </div>
                </div>

                <div class="mt-8 grid grid-cols-2 gap-6">
                    <div>
                        <p class="text-sm text-gray-500">Ngày đặt</p>
                        <p id="orderDate" class="font-medium"></p>
                    </div>
                    <div>
                        <p class="text-sm text-gray-500">Dự kiến giao</p>
                        <p id="deliveryDate" class="font-medium text-cyan-600"></p>
                    </div>
                </div>

                <div class="mt-8">
                    <p class="text-sm text-gray-500 mb-3">Sản phẩm</p>
                    <div id="orderProducts" class="space-y-4"></div>
                </div>

                <div class="mt-8 flex justify-between text-xl font-bold">
                    <span>Tổng thanh toán</span>
                    <span id="orderTotal" class="text-cyan-600"></span>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
let orders = JSON.parse(localStorage.getItem('orders')) || [];

function searchOrder() {
    const code = document.getElementById('orderCode').value.trim().toUpperCase();
    const result = document.getElementById('result');

    if (!code) {
        alert("Vui lòng nhập mã đơn hàng!");
        return;
    }

    const order = orders.find(o => o.id.toUpperCase() === code);

    if (order) {
        document.getElementById('modalOrderId').textContent = order.id;
        document.getElementById('orderDate').textContent = order.date;
        document.getElementById('deliveryDate').textContent = order.deliveryDate;
        document.getElementById('orderTotal').textContent = order.total.toLocaleString('vi-VN') + 'đ';

        // Trạng thái
        const statusEl = document.getElementById('statusBadge');
        statusEl.textContent = order.status;
        statusEl.className = `inline-block px-5 py-1 rounded-full text-sm font-medium ${
            order.status === 'Hoàn thành' ? 'bg-green-100 text-green-700' :
            order.status === 'Đang giao' ? 'bg-blue-100 text-blue-700' :
            order.status === 'Đang xử lý' ? 'bg-yellow-100 text-yellow-700' : 'bg-gray-100 text-gray-700'
        }`;

        // Sản phẩm
        let productHTML = '';
        order.items.forEach(item => {
            productHTML += `
                <div class="flex justify-between">
                    <span>${item.name} × ${item.qty}</span>
                    <span class="font-medium">${item.price.toLocaleString('vi-VN')}đ</span>
                </div>`;
        });
        document.getElementById('orderProducts').innerHTML = productHTML;

        result.classList.remove('hidden');
    } else {
        alert("❌ Không tìm thấy đơn hàng với mã này!");
        result.classList.add('hidden');
    }
}

// Tạo dữ liệu mẫu đơn hàng (để test)
if (orders.length === 0) {
    orders = [
        {
            id: "#VS20260422-7842",
            date: "22/04/2026",
            deliveryDate: "25/04/2026",
            status: "Đang giao",
            total: 28990000,
            items: [{name: "Dyson V15 Detect", qty: 1, price: 28990000}]
        }
    ];
    localStorage.setItem('orders', JSON.stringify(orders));
}
</script>
</body>
</html>
